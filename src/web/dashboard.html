<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keystone Outreach</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#667085; --line:#e4e7ec; --accent:#2f6fed; --ok:#12805c; --warn:#b54708; --bad:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#171a21; --ink:#e6e8eb; --muted:#98a2b3; --line:#2a2f3a; --accent:#6c9cff; --ok:#3ccb8f; --warn:#f5a524; --bad:#f97066; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:16px; border-bottom:1px solid var(--line); background:var(--card); }
  h1 { font-size:18px; margin:0; } h2 { font-size:15px; margin:0 0 10px; }
  main { padding:16px; max-width:1200px; margin:0 auto; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .funnel { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; }
  .stage { border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; }
  .stage b { display:block; font-size:20px; } .stage span { color:var(--muted); font-size:12px; text-transform:capitalize; }
  .stage.active { outline:2px solid var(--accent); }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); color:var(--muted); }
  .pill.dry { color:var(--warn); border-color:var(--warn); }
  form.inline { display:flex; flex-wrap:wrap; gap:8px; }
  input, textarea, select { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  textarea { width:100%; min-height:90px; resize:vertical; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; padding:6px 10px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.ok { color:var(--ok); border-color:var(--ok); } button.bad { color:var(--bad); border-color:var(--bad); }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; } tr.row { cursor:pointer; } tr.row:hover { background:var(--bg); }
  .scroll { overflow-x:auto; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  .queue-item { border-top:1px solid var(--line); padding:12px 0; display:grid; gap:8px; } .queue-item:first-of-type { border-top:0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width:760px){ .grid2 { grid-template-columns:1fr; } }
  ul.findings { margin:4px 0; padding-left:18px; } ul.findings li.problem::marker { color:var(--bad); } ul.findings li.opportunity::marker { color:var(--ok); }
  dialog { width:min(820px,100% - 32px); border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); padding:16px; }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  .actions { display:flex; flex-wrap:wrap; gap:6px; }
  pre { white-space:pre-wrap; margin:0; font:inherit; }
  #toast { position:fixed; bottom:16px; right:16px; background:var(--ink); color:var(--bg); padding:8px 12px; border-radius:8px; display:none; max-width:calc(100% - 32px); }
</style>
</head>
<body>
<header>
  <div><h1>Keystone Outreach</h1><span class="muted small">Find → Enrich → AI draft → Approve → Email/SMS → CRM</span></div>
  <div class="actions"><span id="mode" class="pill"></span><span id="dry" class="pill dry" hidden>DRY RUN</span>
    <button id="runAll" class="primary">Run pipeline</button><button id="sendDue">Send due</button></div>
</header>
<main>
  <section class="card">
    <h2>Find businesses</h2>
    <form id="findForm" class="inline">
      <input name="industry" placeholder="Industry (e.g. roofer)" required>
      <input name="city" placeholder="City (e.g. Denver, CO)" required>
      <input name="limit" type="number" min="1" max="60" value="20" style="width:80px">
      <button class="primary">Find leads</button>
    </form>
  </section>

  <section class="card">
    <h2>Pipeline</h2>
    <div id="funnel" class="funnel"></div>
  </section>

  <section class="card">
    <h2>Approval queue <span id="queueCount" class="pill"></span></h2>
    <div id="queue"></div>
  </section>

  <section class="card">
    <h2>Leads <span id="filterLabel" class="pill">all</span></h2>
    <div class="scroll"><table>
      <thead><tr><th>Business</th><th>Contact</th><th>Industry / City</th><th>Score</th><th>Status</th></tr></thead>
      <tbody id="leads"></tbody>
    </table></div>
  </section>
</main>

<dialog id="detail"></dialog>
<div id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
let token = (() => { try { return localStorage.getItem("keystoneToken") || ""; } catch { return ""; } })();
let filter = "";

async function api(path, opts = {}) {
  const res = await fetch("/api" + path, { ...opts, headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) } });
  if (res.status === 401) {
    token = prompt("Dashboard token") || "";
    try { localStorage.setItem("keystoneToken", token); } catch {}
    return api(path, opts);
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body || {}) });
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3500); }
async function act(fn, ok) { try { const r = await fn(); if (ok) toast(typeof ok === "function" ? ok(r) : ok); await refresh(); return r; } catch (e) { toast("Error: " + e.message); } }

async function refresh() {
  const [stats, leads, queue] = await Promise.all([api("/stats"), api("/leads" + (filter ? "?status=" + filter : "")), api("/leads?status=pending_approval")]);
  $("#mode").textContent = "approval: " + stats.approvalMode;
  $("#dry").hidden = !stats.dryRun;
  $("#funnel").innerHTML = stats.stages.map((s) =>
    `<div class="stage ${filter === s ? "active" : ""}" data-stage="${s}"><b>${stats.byStatus[s] || 0}</b><span>${s.replace("_", " ")}</span></div>`).join("");
  $("#filterLabel").textContent = filter || "all";
  $("#queueCount").textContent = queue.length;
  $("#queue").innerHTML = queue.length ? queue.map(queueItem).join("") : `<p class="muted">Nothing waiting for approval.</p>`;
  $("#leads").innerHTML = leads.map((l) => `<tr class="row" data-id="${l.id}">
    <td><b>${esc(l.businessName)}</b><div class="muted small">${esc(l.website || "no website")}</div></td>
    <td>${esc(l.contactName || "—")}<div class="muted small">${esc(l.email || "")} ${esc(l.phone || "")}</div></td>
    <td>${esc(l.industry || "")}<div class="muted small">${esc(l.city || "")}</div></td>
    <td>${l.score ?? "—"}</td><td><span class="pill">${esc(l.status)}</span></td></tr>`).join("") || `<tr><td colspan="5" class="muted">No leads yet.</td></tr>`;
}

function findingsList(l) {
  const f = l.audit?.findings || [];
  return f.length ? `<ul class="findings">${f.map((x) => `<li class="${x.kind}">${esc(x.detail)}</li>`).join("")}</ul>` : `<p class="muted small">No audit.</p>`;
}

function queueItem(l) {
  const d = l.draft || {};
  return `<div class="queue-item" data-id="${l.id}">
    <div><b>${esc(l.businessName)}</b> <span class="pill">score ${l.score ?? "?"}</span>
      <span class="muted small">${esc(l.contactName || "")} ${esc(l.email || "")} ${esc(l.phone || "")}</span></div>
    <div class="grid2">
      <div><label class="small muted">Email subject</label><input data-f="emailSubject" value="${esc(d.emailSubject)}" style="width:100%">
        <label class="small muted">Email body</label><textarea data-f="emailBody" rows="8">${esc(d.emailBody)}</textarea></div>
      <div><label class="small muted">SMS</label><textarea data-f="smsBody">${esc(d.smsBody)}</textarea>
        <label class="small"><input type="checkbox" data-f="smsConsent" ${l.smsConsent ? "checked" : ""}> Lead has consented to SMS</label>
        <div class="small muted" style="margin-top:6px">Why: ${esc(d.reasoning)}</div>${findingsList(l)}</div>
    </div>
    <div class="actions"><button class="ok" data-act="approve">Approve</button><button data-act="approve-send" class="primary">Approve &amp; send now</button>
      <button data-act="redraft">Redraft with AI</button><button class="bad" data-act="reject">Reject</button></div>
  </div>`;
}

async function openDetail(id) {
  const l = await api("/leads/" + id);
  const d = l.draft;
  $("#detail").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:8px"><h2>${esc(l.businessName)} <span class="pill">${esc(l.status)}</span></h2><button data-close>Close</button></div>
    <p class="small">${esc(l.contactName || "Unknown contact")} · ${esc(l.email || "no email")} · ${esc(l.phone || "no phone")}<br>
      ${l.website ? `<a href="${esc(l.website)}" target="_blank" rel="noopener">${esc(l.website)}</a>` : "No website"} · ${esc(l.industry || "")} · ${esc(l.city || "")} · score ${l.score ?? "?"}</p>
    <h2>Website problems &amp; opportunities</h2>${findingsList(l)}
    ${d ? `<h2>Draft</h2><p><b>${esc(d.emailSubject)}</b></p><pre class="small">${esc(d.emailBody)}</pre><p class="small"><b>SMS:</b> ${esc(d.smsBody)}</p>` : ""}
    <h2>Messages</h2>${l.messages.length ? l.messages.map((m) => `<p class="small"><span class="pill">${m.direction} ${m.channel}</span> <span class="pill">${esc(m.status)}</span> ${esc(m.createdAt)}<br>${esc(m.body.slice(0, 300))}${m.error ? `<br><span style="color:var(--bad)">${esc(m.error)}</span>` : ""}</p>`).join("") : `<p class="muted small">None yet.</p>`}
    <h2>Timeline</h2>${l.events.map((e) => `<div class="small"><span class="muted">${esc(e.createdAt)}</span> <b>${esc(e.type)}</b> ${esc(e.detail || "")}</div>`).join("")}
    <h2 style="margin-top:12px">Actions</h2>
    <div class="actions" data-id="${l.id}">
      <button data-act="enrich">Re-enrich</button><button data-act="draft">Draft</button><button data-act="send">Send due</button>
      ${["interested", "booked", "closed", "lost", "opted_out"].map((s) => `<button data-stage="${s}">Mark ${s.replace("_", " ")}</button>`).join("")}
    </div>`;
  $("#detail").showModal();
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button,.stage,tr.row");
  if (!t) return;
  if (t.matches("[data-close]")) return $("#detail").close();
  if (t.matches(".stage")) { filter = filter === t.dataset.stage ? "" : t.dataset.stage; return refresh(); }
  if (t.matches("tr.row")) return openDetail(t.dataset.id);
  const box = t.closest("[data-id]");
  const id = box?.dataset.id;
  const a = t.dataset.act;
  if (t.dataset.stage && id) { await act(() => post(`/leads/${id}/stage`, { stage: t.dataset.stage }), "Updated"); return openDetail(id); }
  if (!a || !id) return;
  if (a === "approve" || a === "approve-send") {
    const edits = {};
    box.querySelectorAll("[data-f]").forEach((el) => edits[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value);
    await act(async () => { await post(`/leads/${id}/approve`, edits); if (a === "approve-send") return post(`/leads/${id}/send`); },
      (r) => r ? `email: ${r.email ?? "sent"} · sms: ${r.sms ?? "sent"}` : "Approved");
  }
  if (a === "reject") await act(() => post(`/leads/${id}/reject`, { reason: prompt("Reason?") || "rejected" }), "Rejected");
  if (a === "redraft") await act(() => post(`/leads/${id}/redraft`), "New draft ready");
  if (a === "enrich") { await act(() => post(`/leads/${id}/enrich`), "Enriched"); openDetail(id); }
  if (a === "draft") { await act(() => post(`/leads/${id}/draft`), (r) => "Decision: " + r.decision.action); openDetail(id); }
  if (a === "send") { await act(() => post(`/leads/${id}/send`), (r) => `email: ${r.email ?? "sent"} · sms: ${r.sms ?? "sent"}`); openDetail(id); }
});

$("#findForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  act(() => post("/find", f), (r) => `Found ${r.found}, ${r.created} new`);
});
$("#runAll").onclick = () => act(() => post("/run"), (r) => "Run: " + JSON.stringify(r));
$("#sendDue").onclick = () => act(() => post("/send-due"), (r) => `Sent ${r.sent.length}, held ${r.held.length}`);
refresh().catch((e) => toast(e.message));
setInterval(() => refresh().catch(() => {}), 30000);
</script>
</body>
</html>
